<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Sentinel Travel Ops — Assistance & Claims Cloud</title>
    <script>
      // Apply theme class before paint to avoid FOUC.
      // Priority: ?theme=light|dark > localStorage > default dark.
      (function () {
        var t = null;
        try {
          t = new URL(window.location.href).searchParams.get("theme");
        } catch (_) {}
        if (t !== "light" && t !== "dark") {
          try { t = localStorage.getItem("sentinel.theme"); } catch (_) {}
        }
        if (t !== "light") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
